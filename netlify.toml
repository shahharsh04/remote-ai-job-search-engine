# Netlify deploys the STATIC FRONTEND ONLY.
#
# The Python backend (api.py) runs on Render - a pipeline run takes
# minutes, far past Netlify's 26s function limit.
#
# `base = "frontend"` matters: it scopes the build to the frontend folder
# so Netlify never sees requirements.txt at the repo root and never tries
# to install Python. An earlier build failed exactly that way, trying to
# install python-3.11 from a runtime.txt meant for Render.
#
# There is no bundler here - the frontend is plain HTML/CSS/JS - so the
# build step only injects the backend URL into config.js. No URL is ever
# hardcoded in the deployed site.

[build]
  base = "frontend"
  publish = "."
  command = """
    URL="${VITE_API_BASE_URL:-$API_BASE_URL}"
    if [ -z "$URL" ]; then
      echo 'ERROR: VITE_API_BASE_URL is not set.' >&2
      echo 'Set it under Site configuration -> Environment variables, then redeploy.' >&2
      exit 1
    fi
    case "$URL" in
      http://localhost*|http://127.0.0.1*)
        echo "ERROR: VITE_API_BASE_URL points at localhost ($URL)." >&2
        echo 'A deployed site cannot reach your machine. Use the Render URL.' >&2
        exit 1 ;;
    esac
    printf 'window.APP_CONFIG = { API_BASE_URL: "%s" };\n' "$URL" > config.js
    echo "config.js written for $URL"
  """

# No Python or Node build is needed for the static frontend.
[build.environment]
  PYTHON_VERSION = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store"
