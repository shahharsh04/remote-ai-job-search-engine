# =============================================================================
# Remote AI Job Search Engine - Configuration
# These are the settings that stay the same across searches. The job
# title and the region (USA / UK / Australia / Europe) are chosen
# interactively each time you run `python main.py` - you don't need to
# edit this file to run a new search.
#
# STRICT COUNTRY LOCK: whichever region/country is selected at the
# prompt is the only one ever searched for that run. The system never
# falls back to another country to reach MAX_QUALIFIED_LEADS below - see
# main.py's REGION_DEFINITIONS note and execute_pipeline().
# =============================================================================

# Job platforms to search every time.
#
# "indeed" and "linkedin" go through JobSpy (see main.JOBSPY_PLATFORMS).
# Google Jobs ("google") has been REMOVED - see job_sources.py's module
# docstring and README sec. 7b for why - replaced by dedicated remote
# job boards, each reached through its own public API or RSS feed (see
# job_sources.PLATFORM_REGISTRY and the `job_sources:` block below):
#   remoteok        - https://remoteok.com/api            (public JSON API)
#   remotive        - https://remotive.com/api/remote-jobs (public JSON API)
#   weworkremotely  - per-category RSS feeds               (public RSS)
#   jobspresso      - https://jobspresso.co/jobs/feed/      (public RSS)
#
# NOT included, on purpose - no legitimate free/public access exists:
#   Wellfound / AngelList Talent - no public API; job search needs an
#     authenticated session, and robots.txt blocks the job-detail URLs.
#   FlexJobs - subscription paywall; its terms prohibit automated
#     collection of listings, and it offers no public API.
# Add a platform by writing search_<name>() in job_sources.py,
# registering it in PLATFORM_REGISTRY, then adding its name below -
# nothing in main.py or pipeline.py needs to change.
platforms: ["indeed", "linkedin", "zip_recruiter", "glassdoor", "remoteok", "remotive", "weworkremotely", "jobspresso"]

# Only consider postings from the last N hours (720 = 30 days). Raised
# from the original 168 (7 days): a 7-day window is one of the two
# biggest constraints on raw USA company coverage (the other was
# keyword_expansion.max_keywords below) - most boards' remote-AI postings
# for a given title simply do not refresh fast enough for a 7-day window
# to surface more than a couple hundred companies, no matter how many
# keywords or pages are searched. This still respects the selected
# country - it only widens the time window, never the location.
hours_old: 720

# How many results to request per platform, per page, before dedup/capping.
# Fetching generously here means MAX_QUALIFIED_LEADS (below, in
# lead_pipeline) is more likely to be reached after duplicates are removed.
results_wanted_per_platform: 100

# How many pages to page through per platform (via JobSpy's `offset`).
# Raising this collects more jobs when a platform has them; it does not
# invent jobs when a platform has run out. Sized up so pagination can
# actually reach MAX_QUALIFIED_LEADS worth of unique companies before a
# country's available results are exhausted.
max_pages_per_platform: 10

# How many of the configured platforms are fetched concurrently for one
# query (Indeed, LinkedIn, ZipRecruiter, Glassdoor, RemoteOK, Remotive,
# We Work Remotely, Jobspresso - 8 total). Concurrency is what fixed
# runs that previously took well over an hour purely from fetching
# platforms one after another, but running all 8 at once was observed to
# make the API's own trivial endpoints (health check, starting a new
# search) time out while a search was active, on a resource-constrained
# host. Only Indeed and LinkedIn are genuinely slow, so 4 still lets both
# run alongside the fast ones without needing every thread at once.
# Raise this on a host with more CPU headroom; the ceiling is 8 (no
# benefit past the number of configured platforms).
platform_fetch_concurrency: 4

# NOTE: no longer caps the "Raw Jobs Found" Excel sheet - that sheet
# deliberately contains every raw job row collected, uncapped, so it can
# never be smaller than what was actually fetched (see requirement "do
# not replace raw jobs with qualified jobs"). This setting only bounds
# the legacy collect_jobs()/cap_and_reshape() CLI helper, which the live
# search path (execute_pipeline) does not call.
target_total_jobs: 5000

# OVERALL_SEARCH_TIMEOUT (seconds). The single ceiling on how long one run
# may spend actively searching job boards, checked between queries. Once
# passed, the run stops starting new queries and exports whatever was
# already collected instead of continuing forever - the run/export
# summary says explicitly whether this is why it stopped. 1800s (30 min)
# balances that against genuine multi-keyword, multi-platform coverage:
# each LinkedIn-touching query alone typically costs 1-3 minutes purely
# from JobSpy's own built-in anti-detection pacing, which this project
# does not attempt to bypass or shorten. Raise it if you want a run to
# keep searching longer toward MAX_QUALIFIED_LEADS; lower it for a
# faster, smaller-but-bounded run.
search_timeout_seconds: 1800

# Lead target controls when the location search stops. This is different
# from target_total_jobs, which controls the size of the job audit sheet.
lead_search:
  # Search up to this many valid remote job rows per location pass before
  # running the company/ICP/contact pipeline to see how many leads exist.
  job_buffer_per_location: 250

# Folder where the output .xlsx file is written.
output_dir: "./output"


# How much evidence a posting needs before it counts as remote.
#   balanced (default) - trust the platform's server-side remote filter
#                        for rows whose wording says nothing either way.
#                        More jobs; a few may need spot-checking.
#   strict             - only keep rows with positive remote evidence
#                        (platform flag, or "remote"/"work from home"
#                        wording). Fewer jobs, higher confidence.
remote_strictness: "balanced"


# =============================================================================
# Similar-job-title keyword expansion
# =============================================================================
# A search for "AI Engineer" also searches the titles recruiters use for
# the same job - "Machine Learning Engineer", "ML Engineer", "AI/ML
# Engineer" and so on - across every platform above.
#
# The title you type is always keyword #1 and is never rewritten;
# expansion only adds terms. Every added term is validated first: too
# broad ("Engineer"), a different kind of role ("Data Analyst" for an
# engineering search) or malformed terms are rejected and reported.
#
# Set enabled: false to search exactly the title you typed, as before.
keyword_expansion:
  enabled: true

  # Total keywords searched per run, INCLUDING your own title. Each
  # extra keyword is another pass over every platform, so this is the
  # main cost/coverage dial. The keyword loop stops early once the
  # target row count is met, so this is a ceiling, not a fixed cost.
  #
  # Raised from the original 6, which was the single biggest cause of
  # thin raw company coverage: keywords.py's curated "ai_engineering"
  # family alone now lists 17 related titles (AI Engineer, Machine
  # Learning Engineer, Applied AI Engineer, ML Engineer, AI/ML Engineer,
  # Applied Machine Learning Engineer, AI Software Engineer, Machine
  # Learning Software Engineer, Deep Learning Engineer, Generative AI
  # Engineer, LLM Engineer, AI Developer, Machine Learning Developer, NLP
  # Engineer, Computer Vision Engineer, MLOps Engineer, AI Research
  # Engineer) and a cap of 6 discarded most of them before a single
  # platform was ever queried.
  max_keywords: 20

  # Generate "Engineer" <-> "Developer" variants of the title.
  role_noun_synonyms: true

  # Generate the opposite spelling of an abbreviation, e.g.
  # "AI Engineer" -> "Artificial Intelligence Engineer".
  abbreviation_variants: true

  # Carry "Senior"/"Lead" from your title onto the generated keywords.
  # Off by default - job boards match seniority loosely, and adding it
  # narrows results sharply for little gain.
  preserve_seniority: false

  # Force in keywords the built-in tables do not cover. Keyed by the
  # title you type (matched loosely, so casing and "Sr." do not matter).
  # These are trusted: only their shape is checked, not their topic.
  extra_synonyms: {}
  #  "AI Engineer":
  #    - "Foundation Model Engineer"

  # Extra terms to reject, added to the built-in list of broad terms.
  blocked_terms: []

  # Optional: ask a model for additional titles. Off by default; the
  # built-in tables need no API key and no network call.
  #
  # The model is asked for job TITLES only - it is never a source of job
  # listings, and everything it returns goes through the same validation
  # as every other keyword before any platform is searched.
  # Needs `pip install anthropic` and ANTHROPIC_API_KEY in the
  # environment. If it fails or is unreachable, the run continues on the
  # built-in tables.
  ai:
    enabled: false
    provider: "anthropic"
    model: "claude-sonnet-5"
    max_suggestions: 8
    timeout_seconds: 20
    api_key_env: "ANTHROPIC_API_KEY"


# =============================================================================
# Dedicated job-board connectors (job_sources.py)
# =============================================================================
# Network settings for the platforms in `platforms` above that are NOT
# fetched through JobSpy - RemoteOK, Remotive, We Work Remotely,
# Jobspresso. Every platform inherits `defaults` below, then can be
# overridden individually by name. A platform that fails (timeout, HTTP
# error, malformed response) is skipped after `max_retries` - the run
# continues on every other platform, it never stops the whole search.
job_sources:
  defaults:
    timeout_seconds: 12
    max_retries: 2
    retry_backoff_seconds: 1.5
    # Identifies this tool to the API/feed it is calling. Polite and
    # traceable; not a secret.
    user_agent: "RemoteJobSearchEngine/1.0 (+job search tool; contact via repository)"

  remoteok:
    # RemoteOK's feed has no search parameter - it returns its ~100 most
    # recent postings, filtered here by keyword and location. This caps
    # how many of THOSE matches are kept, not how many are fetched, so
    # raising it (vs. the old 40) costs nothing extra over the network -
    # it just stops leaving genuine matches on the table.
    results_wanted: 150

  remotive:
    # Remotive's API has a real `search` parameter, so the keyword is
    # sent server-side rather than filtered after the fact.
    results_wanted: 150

  weworkremotely:
    results_wanted: 150
    # RSS has no keyword search, so these category feeds are fetched in
    # full and filtered by keyword locally. Add/remove slugs from
    # https://weworkremotely.com/categories as your searches need.
    categories:
      - "remote-programming-jobs"
      - "remote-full-stack-programming-jobs"
      - "remote-back-end-programming-jobs"
      - "remote-front-end-programming-jobs"
      - "remote-devops-sysadmin-jobs"

  jobspresso:
    results_wanted: 150


# =============================================================================
# Lead-generation pipeline
# =============================================================================
# Everything the lead stages use lives here - no threshold is hard-coded
# in the stage logic, so the pipeline can be retuned without touching
# any .py file.
lead_pipeline:

  # ---- Company size bands (employees) --------------------------------
  # Preferred ICP: 20-500. Medium priority: 500-5,000. Low: 5,000+.
  preferred_min_employees: 20
  preferred_max_employees: 500
  medium_priority_employee_threshold: 500
  low_priority_employee_threshold: 5000

  # ---- Final qualified-leads list ---------------------------------------
  # MAX_QUALIFIED_LEADS: the single configurable ceiling on how many
  # qualified leads are collected and exported to the "Qualified Leads"
  # sheet. This is a MAXIMUM, not a fixed target - the system keeps
  # searching (more queries, more pages) until either this many qualified
  # leads are found or every configured query/page for the selected
  # country is exhausted; fewer are exported when fewer valid, country-
  # locked leads exist, and the run is NEVER padded and NEVER switches
  # the user's selected country to make up the difference. The list is
  # always sorted High -> Medium -> Low by priority score.
  #
  # (max_companies/target_leads/max_final_leads/min_final_leads are
  # legacy setting names kept only for older config files; if present
  # without max_qualified_leads they are read as an alias for it. Set
  # max_qualified_leads here - it is the one setting this system
  # actually needs.)
  max_qualified_leads: 50

  # ---- Buyer Probability / Low Probability Buyer Dictionary -----------
  # Company types whose primary business competes with an AI
  # engineering/services offering. These companies are NOT discarded -
  # every one of them is still scored, kept, and exported to Excel with
  # Buyer Probability = Low (see pipeline.IcpFilteringStage and
  # lead_signals.score_company). Delete an entry below to stop flagging
  # that type as low-probability. Large organisations are deliberately
  # NOT here: they stay in the dataset and simply score lower.
  excluded_company_types:
    - staffing_agency
    - recruitment_agency
    - it_services
    - ai_ml_consulting
    - software_outsourcing
    - bpo_services

  # Write excluded companies to their own CSV for audit.
  save_excluded_companies: true
  # Persistent cumulative dictionary across application runs.
  excluded_company_dictionary_path: data/excluded_companies.json

  # ---- Contact enrichment ---------------------------------------------
  contact_enrichment:
    # Fetch the company's own public careers page over plain HTTP.
    # Turn off to keep the run offline apart from the job boards.
    enable_careers_page_lookup: true
    respect_robots_txt: true
    # Per-HTTP-call timeout. Lowered from 8s: with up to 5 requests per
    # company (1 robots.txt + up to 4 candidate paths - see
    # contacts.CAREERS_PATHS), 8s made the true worst case per company
    # ~40s: on a resource-constrained host, hundreds of unresponsive
    # sites at that cost was enough to make the whole enrichment stage
    # look hung even though every individual call was bounded.
    request_timeout_seconds: 5
    # Enrichment makes network calls, so it is budgeted per run. Lowered
    # back from an earlier 300: at up to ~25s worst case per company (5
    # requests x 5s) and enrichment_stage_timeout_seconds below, 300
    # companies could realistically need more time than the stage is
    # allowed - meaning many would go "Not attempted" regardless. 100
    # comfortably fits the stage timeout in the typical case (most sites
    # answer, or fail, in far less than the worst case) while still far
    # exceeding the original default of 20.
    max_companies_to_enrich: 100
    # How many companies' careers-page lookups run at once. Each request
    # targets a different company's own domain (plus one robots.txt fetch
    # per company, cached - see contacts.py), so this is a wall-clock
    # optimization, not a rate-limit bypass against any single site.
    # Running max_companies_to_enrich fully sequentially was one of the
    # two biggest contributors to multi-hour runs; 10 concurrent requests
    # cuts that roughly tenfold. Lower it toward 1 if you need fully
    # serialized requests, or if a resource-constrained host (e.g. a
    # small cloud instance) shows contention with this many threads.
    max_concurrent_requests: 10
    # HARD, FIXED ceiling (not scaled by max_companies_to_enrich) on how
    # long the whole enrichment stage may run - the fix for a run that
    # takes "technically bounded but over an hour anyway": an earlier
    # version of this scaled with company count and could reach ~37
    # minutes in a legitimate worst case. Any company still queued when
    # this fires is reported "Not attempted" rather than waited on
    # further - honest, not padded, same as the budget above.
    enrichment_stage_timeout_seconds: 300
    # LinkedIn *search* links for recruiter titles. These are research
    # links, never claimed profiles - profiles cannot be read without
    # scraping behind a login, which this project does not do.
    generate_linkedin_search_urls: true
    user_agent: "RemoteJobSearchEngine/1.0 (lead research)"

  # ---- Prioritisation scoring -----------------------------------------
  scoring:
    # Points per factor. Raise a weight to make that factor matter more;
    # the total is normalised to 0-100 regardless of the weights chosen.
    weights:
      icp_fit: 30
      hiring_signal: 25
      contact_found: 15
      multiple_openings: 10
      funding_signal: 10
      new_ai_initiative: 10

    # Normalised score needed for each priority band.
    priority_bands:
      high_min_score: 70
      medium_min_score: 45
